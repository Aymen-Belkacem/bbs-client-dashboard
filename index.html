<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Food Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <section>
        <h1>Food consommation</h1>

        <div class="form">
            <input type="text" id="username" placeholder="Bob" />
            <button onclick="loadData()">Analyse</button>
        </div>

        <canvas id="caloriesByDay"></canvas>
        <canvas id="caloriesByFood"></canvas>
    </section>

    <section>
        <h1>Food entry stats</h1>

        <div class="form">
            <input type="text" id="foodprocessed_id" placeholder="1" />
            <button onclick="loadData2()">Fetch processed food entry</button>
        </div>

        <canvas id="foodEntryStats"></canvas>
    </section>

    <script src="config.js"></script>
    <script src="app.js"></script>



</body>

</html>
